<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a2e"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a8c"/>
      <stop offset="0.55" stop-color="#6b4f9e"/>
      <stop offset="1" stop-color="#c06c84"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a52" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff5a52"/>
    </linearGradient>
    <clipPath id="screen"><rect x="60" y="120" width="760" height="300" rx="6"/></clipPath>
    <clipPath id="meet"><rect x="930" y="150" width="300" height="230" rx="10"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="72" fill="#ffffff" font-size="34" font-weight="700">Share part of your ultrawide screen</text>
  <text x="60" y="102" fill="#9aa3c7" font-size="17">Pick a frame. Share one window. Viewers see only what's inside, sharp and at 60 fps.</text>

  <!-- Ultrawide monitor -->
  <g filter="url(#shadow)">
    <rect x="48" y="108" width="784" height="324" rx="14" fill="#2a2f42"/>
  </g>
  <g clip-path="url(#screen)">
    <rect x="60" y="120" width="760" height="300" fill="url(#wall)"/>
    <!-- menu bar -->
    <rect x="60" y="120" width="760" height="14" fill="#000" fill-opacity="0.35"/>
    <rect x="740" y="124" width="12" height="7" rx="1.5" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <!-- left window: chat -->
    <rect x="76" y="150" width="190" height="250" rx="8" fill="#1d2233"/>
    <rect x="76" y="150" width="190" height="20" rx="8" fill="#2b3147"/>
    <rect x="90" y="186" width="120" height="10" rx="5" fill="#4a5275"/>
    <rect x="90" y="204" width="150" height="10" rx="5" fill="#4a5275"/>
    <rect x="110" y="228" width="140" height="10" rx="5" fill="#3c6df0"/>
    <rect x="90" y="252" width="100" height="10" rx="5" fill="#4a5275"/>
    <rect x="90" y="270" width="140" height="10" rx="5" fill="#4a5275"/>
    <!-- center window: slides / code (the shared one) -->
    <rect x="290" y="150" width="320" height="250" rx="8" fill="#f5f6fa"/>
    <rect x="290" y="150" width="320" height="22" rx="8" fill="#e3e5ee"/>
    <circle cx="304" cy="161" r="4" fill="#ff5f57"/><circle cx="318" cy="161" r="4" fill="#febc2e"/><circle cx="332" cy="161" r="4" fill="#28c840"/>
    <rect x="312" y="192" width="170" height="16" rx="4" fill="#1d2233"/>
    <rect x="312" y="222" width="270" height="9" rx="4.5" fill="#b8bdd0"/>
    <rect x="312" y="240" width="240" height="9" rx="4.5" fill="#b8bdd0"/>
    <rect x="312" y="266" width="80" height="100" rx="4" fill="#3c6df0"/>
    <rect x="404" y="296" width="80" height="70" rx="4" fill="#6b4f9e"/>
    <rect x="496" y="246" width="80" height="120" rx="4" fill="#c06c84"/>
    <!-- annotation drawn on top -->
    <path d="M500 232 C 540 220, 590 240, 580 270" fill="none" stroke="#ff3b30" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M572 262 L580 272 L588 260" fill="none" stroke="#ff3b30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- right window: notes -->
    <rect x="634" y="150" width="170" height="250" rx="8" fill="#1d2233"/>
    <rect x="634" y="150" width="170" height="20" rx="8" fill="#2b3147"/>
    <rect x="648" y="186" width="110" height="10" rx="5" fill="#4a5275"/>
    <rect x="648" y="204" width="130" height="10" rx="5" fill="#4a5275"/>
    <rect x="648" y="222" width="90" height="10" rx="5" fill="#e0a43a"/>
    <!-- dim outside the frame -->
    <path fill="#000" fill-opacity="0.5" fill-rule="evenodd" d="M60 120 H820 V420 H60 Z M282 142 H618 V408 H282 Z"/>
    <!-- share frame -->
    <rect x="282" y="142" width="336" height="266" fill="none" stroke="#ff5a52" stroke-width="3"/>
    <g fill="#ffffff" stroke="#ff5a52" stroke-width="2">
      <rect x="277" y="137" width="10" height="10" rx="2"/><rect x="613" y="137" width="10" height="10" rx="2"/>
      <rect x="277" y="403" width="10" height="10" rx="2"/><rect x="613" y="403" width="10" height="10" rx="2"/>
      <rect x="445" y="137" width="10" height="10" rx="2"/><rect x="445" y="403" width="10" height="10" rx="2"/>
    </g>
    <!-- floating control bar (hidden from viewers) -->
    <g transform="translate(72 376) scale(0.82)">
      <rect width="240" height="30" rx="9" fill="#2b3147" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="18" cy="15" r="6" fill="#9aa3c7"/>
      <rect x="34" y="6" width="18" height="18" rx="5" fill="#3c6df0"/>
      <circle cx="68" cy="15" r="6" fill="#9aa3c7"/><circle cx="90" cy="15" r="6" fill="#9aa3c7"/>
      <circle cx="112" cy="15" r="6" fill="#ff3b30"/><circle cx="130" cy="15" r="6" fill="#ffcc00"/><circle cx="148" cy="15" r="6" fill="#34c759"/>
      <circle cx="176" cy="15" r="6" fill="#9aa3c7"/><circle cx="198" cy="15" r="6" fill="#9aa3c7"/>
      <rect x="212" y="6" width="18" height="18" rx="5" fill="#ff3b30"/>
    </g>
  </g>
  <!-- stand -->
  <rect x="400" y="432" width="80" height="34" fill="#232838"/>
  <rect x="340" y="466" width="200" height="10" rx="5" fill="#232838"/>

  <!-- labels under the monitor -->
  <text x="440" y="508" fill="#9aa3c7" font-size="15" text-anchor="middle">Your ultrawide display: frame and control bar are never shared</text>

  <!-- arrow -->
  <path d="M842 265 H905" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M896 254 L910 265 L896 276" fill="none" stroke="#ff5a52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- meeting app -->
  <g filter="url(#shadow)">
    <rect x="918" y="118" width="324" height="300" rx="14" fill="#202536"/>
  </g>
  <circle cx="936" cy="134" r="4.5" fill="#ff5f57"/><circle cx="950" cy="134" r="4.5" fill="#febc2e"/><circle cx="964" cy="134" r="4.5" fill="#28c840"/>
  <text x="1080" y="138" fill="#9aa3c7" font-size="12" text-anchor="middle">Meeting</text>
  <g clip-path="url(#meet)">
    <!-- the shared region, scaled to fit 300x230 (region 336x266 → 0.865) -->
    <g transform="translate(930 150) scale(0.8646) translate(-282 -142)">
      <rect x="282" y="142" width="336" height="266" fill="#f5f6fa"/>
      <rect x="290" y="150" width="320" height="250" rx="8" fill="#f5f6fa"/>
      <rect x="290" y="150" width="320" height="22" rx="8" fill="#e3e5ee"/>
      <circle cx="304" cy="161" r="4" fill="#ff5f57"/><circle cx="318" cy="161" r="4" fill="#febc2e"/><circle cx="332" cy="161" r="4" fill="#28c840"/>
      <rect x="312" y="192" width="170" height="16" rx="4" fill="#1d2233"/>
      <rect x="312" y="222" width="270" height="9" rx="4.5" fill="#b8bdd0"/>
      <rect x="312" y="240" width="240" height="9" rx="4.5" fill="#b8bdd0"/>
      <rect x="312" y="266" width="80" height="100" rx="4" fill="#3c6df0"/>
      <rect x="404" y="296" width="80" height="70" rx="4" fill="#6b4f9e"/>
      <rect x="496" y="246" width="80" height="120" rx="4" fill="#c06c84"/>
      <path d="M500 232 C 540 220, 590 240, 580 270" fill="none" stroke="#ff3b30" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M572 262 L580 272 L588 260" fill="none" stroke="#ff3b30" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- participants -->
  <g>
    <rect x="930" y="388" width="92" height="20" rx="5" fill="#2b3147"/>
    <rect x="1034" y="388" width="92" height="20" rx="5" fill="#2b3147"/>
    <rect x="1138" y="388" width="92" height="20" rx="5" fill="#2b3147"/>
    <circle cx="976" cy="398" r="6" fill="#6b7bb8"/><circle cx="1080" cy="398" r="6" fill="#b86b9a"/><circle cx="1184" cy="398" r="6" fill="#6bb88a"/>
  </g>
  <text x="1080" y="458" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">What viewers see</text>
  <text x="1080" y="482" fill="#9aa3c7" font-size="14" text-anchor="middle">Just the frame, drawings included</text>
</svg>
